<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>X-Unfollower</title>
  <desc>Pixel art icon showing an X with an unfollow indicator</desc>

  <!-- Background: dark slate rounded square -->
  <rect x="1" y="1" width="30" height="30" rx="5" fill="#0e0e12"/>
  <rect x="2" y="2" width="28" height="28" rx="4" fill="#1a1a23"/>

  <!-- Pixel size: each "pixel" = 2x2 units in 32x32 grid -->

  <!-- Cyan accent glow border -->
  <rect x="2" y="2" width="28" height="1" fill="#22d3ee" opacity="0.6"/>
  <rect x="2" y="29" width="28" height="1" fill="#22d3ee" opacity="0.4"/>
  <rect x="2" y="2" width="1" height="28" fill="#22d3ee" opacity="0.4"/>
  <rect x="29" y="2" width="1" height="28" fill="#22d3ee" opacity="0.6"/>

  <!-- X mark - bold pixel X in white/light -->
  <!-- Row 1 (top of X) -->
  <rect x="7" y="6" width="2" height="2" fill="#eeeeff"/>
  <rect x="23" y="6" width="2" height="2" fill="#eeeeff"/>

  <!-- Row 2 -->
  <rect x="9" y="8" width="2" height="2" fill="#eeeeff"/>
  <rect x="21" y="8" width="2" height="2" fill="#eeeeff"/>

  <!-- Row 3 -->
  <rect x="11" y="10" width="2" height="2" fill="#eeeeff"/>
  <rect x="19" y="10" width="2" height="2" fill="#eeeeff"/>

  <!-- Row 4 - center -->
  <rect x="13" y="12" width="6" height="2" fill="#eeeeff"/>
  <rect x="13" y="12" width="6" height="2" fill="#22d3ee" opacity="0.5"/>

  <!-- Row 5 -->
  <rect x="11" y="14" width="2" height="2" fill="#eeeeff"/>
  <rect x="19" y="14" width="2" height="2" fill="#eeeeff"/>

  <!-- Row 6 -->
  <rect x="9" y="16" width="2" height="2" fill="#eeeeff"/>
  <rect x="21" y="16" width="2" height="2" fill="#eeeeff"/>

  <!-- Row 7 (bottom of X) -->
  <rect x="7" y="18" width="2" height="2" fill="#eeeeff"/>
  <rect x="23" y="18" width="2" height="2" fill="#eeeeff"/>

  <!-- Bottom person silhouette - pixel art unfollow indicator -->
  <!-- Head -->
  <rect x="13" y="21" width="6" height="1" fill="#7878a0"/>
  <rect x="12" y="22" width="8" height="1" fill="#7878a0"/>
  <rect x="13" y="23" width="6" height="2" fill="#7878a0"/>

  <!-- Body -->
  <rect x="12" y="25" width="8" height="1" fill="#7878a0"/>
  <rect x="11" y="26" width="10" height="1" fill="#7878a0"/>

  <!-- Unfollow slash - red accent diagonal -->
  <rect x="20" y="21" width="2" height="2" fill="#f43f5e" opacity="0.9"/>
  <rect x="22" y="23" width="2" height="2" fill="#f43f5e" opacity="0.7"/>
  <rect x="24" y="25" width="2" height="2" fill="#f43f5e" opacity="0.5"/>

  <!-- Cyan glow dots on X arms -->
  <rect x="6" y="5" width="2" height="2" fill="#22d3ee" opacity="0.7"/>
  <rect x="24" y="5" width="2" height="2" fill="#22d3ee" opacity="0.7"/>
</svg>
